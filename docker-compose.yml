services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: credit_kiosk
      POSTGRES_USER: credit_kiosk
      POSTGRES_PASSWORD: credit_kiosk
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./mocks/mocks_postgres.sql:/docker-entrypoint-initdb.d/20_mocks.sql:ro
    ports:
      - "127.0.0.1:5433:5432" # 5432 занят локальным Postgres на машине разработчика
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_kiosk -d credit_kiosk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    #ports:
     #sudo ss -tlnp | grep 8000 - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://credit_kiosk:credit_kiosk@postgres:5432/credit_kiosk
      MOCKS_DATABASE_URL: postgresql+psycopg2://credit_kiosk:credit_kiosk@postgres:5432/mocks
      REDIS_URL: redis://redis:6379/0
      COOKIE_NAME: ck_session
      COOKIE_MAX_AGE: "2592000"
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      CORS_ORIGINS: http://localhost:8080,http://localhost:8000
      AUTO_CREATE_TABLES: "false"
      SCORING_MODE: ml
      SCORING_URL: http://ml:8001
      SCORING_TIMEOUT_SECONDS: "5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    # nginx не стартует, пока имя backend не резолвится: перезапуск снимает гонку при старте.
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
  ml:
    build: ./ml
    environment:
      ML_DATABASE_URL: postgresql://credit_kiosk:credit_kiosk@postgres:5432/mocks
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

volumes:
  pgdata:
