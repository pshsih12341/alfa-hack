[project]
name = "alfa-ml"
version = "0.1.0"
description = "ML-часть кредитного конвейера: синтетические данные, фичи, модели скоринга"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.1",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]
# Генерация выборок и обучение: в образ сервиса не входят.
data = [
    "pyarrow>=17",
]

[tool.uv]
default-groups = ["dev", "data"]

[build-system]
requires = ["uv_build>=0.10.7,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
