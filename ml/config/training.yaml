# Обучение моделей 1 и 2: WoE-биннинг + логистическая регрессия (alfa_ml.models.train).

binning:
  prebins: 20             # пред-биннинг по квантилям
  min_bin_share: 0.05     # в интервале не меньше 5% выборки
  max_bins: 8
  # Пропуск — свой интервал уже от 1% выборки: обычно он что-то значит («нет кредитной истории»).
  # Более редкий пропуск сливается с самым рискованным интервалом.
  missing_min_share: 0.01
  # Пропуск значит «нет информации»: WoE пропуска 0, интервалы — по заявкам со значением.
  # Тренд без года выписок не считается — иначе он повторял бы молодость бизнеса.
  neutral_missing: [turnover_trend]

selection:
  min_iv: 0.02            # меньше — фича почти не различает дефолты
  max_correlation: 0.7    # из пары фич с большей корреляцией WoE остаётся фича с большим IV
  max_p_value: 0.05       # незначимые коэффициенты исключаются по одному, начиная с наименее значимого
  # Фичи, которые остаются в модели при малом IV и незначимом коэффициенте. Цель и залог по отдельности
  # слабые (IV ≈ 0.015 и 0.007), но в модели значимы (p < 0.05) и поднимают Gini на test_oot на 0.01.
  forced: [purpose, has_collateral]

# Ожидаемое направление риска числовых фич, как в ml/docs/features.md: 1 — больше значение, выше риск.
# Фичи, которых здесь нет, — категориальные (включая флаги 0/1).
directions:
  business_age_months: -1
  loan_to_revenue: 1
  debt_to_revenue: 1
  revenue_size: -1
  max_dpd_24m: 1
  bki_inquiries_90d: 1
  dscr: -1
  fcf_volatility: 1
  turnover_trend: -1
  revenue_consistency: -1
  top_customer_share: 1
