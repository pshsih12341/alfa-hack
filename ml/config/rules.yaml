# Стоп-правила: юридические запреты, отказ без модели. Всё остальное из истории клиента
# (например, давнее банкротство) — признаки модели, а не автоотказ.
# Окна запретов по банкротству — в scoring.yaml, раздел stop_rules.
# Не юридическая консультация: перед реальным использованием сверить с актуальными редакциями законов.

rules:
  - id: inactive_status
    legal_basis: "129-ФЗ"
    source: "ЕГРЮЛ / ЕГРИП"
    condition: "Статус организации или ИП не «действующий»: ликвидация, реорганизация, исключение, прекращение"
    client_message: "По данным ЕГРЮЛ/ЕГРИП организация не является действующей, поэтому выдать кредит нельзя."
    internal_reason: "Статус в реестре: {status}"

  - id: company_bankruptcy
    legal_basis: "127-ФЗ, ст. 64"
    source: "ЕФРСБ"
    condition: "В отношении компании идёт процедура банкротства"
    client_message: "В отношении компании ведётся процедура банкротства, поэтому выдать кредит нельзя."
    internal_reason: "Идёт процедура банкротства компании"

  - id: owner_bankruptcy
    legal_basis: "127-ФЗ, ст. 213.30 (директор — 3 года), ст. 216 (ИП — 5 лет)"
    source: "ЕФРСБ"
    condition: "Банкротство директора ООО завершено меньше 36 месяцев назад, ИП — меньше 60 месяцев назад"
    client_message: "Процедура банкротства руководителя завершилась недавно: по закону в этот период выдать кредит нельзя."
    internal_reason: "Банкротство {inn} завершено {months} мес. назад, запрет {window} мес."

  - id: rfm_list
    legal_basis: "115-ФЗ"
    source: "Перечень Росфинмониторинга"
    condition: "ИНН компании, директора или участника в перечне"
    # По 115-ФЗ клиенту нельзя сообщать о мерах по ПОД/ФТ — нейтральный текст без причины.
    client_message: "К сожалению, сейчас мы не можем предоставить кредит."
    internal_reason: "ИНН {inn} в перечне Росфинмониторинга"
